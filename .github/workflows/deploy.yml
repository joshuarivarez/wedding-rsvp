name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wedding-rsvp/package-lock.json

      - name: Install dependencies
        working-directory: ./wedding-rsvp
        run: npm ci

      - name: Build Angular
        working-directory: ./wedding-rsvp
        run: npm run build -- --base-href /wedding-rsvp/

      - name: Show build output
        working-directory: ./wedding-rsvp
        run: |
          echo "Angular build output:"
          find dist -maxdepth 4 -type f | sort

      - name: Prepare GitHub Pages files
        working-directory: ./wedding-rsvp
        run: |
          BUILD_INDEX=$(find dist -type f -name "index.html" | head -n 1)

          if [ -z "$BUILD_INDEX" ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          BUILD_DIR=$(dirname "$BUILD_INDEX")

          echo "Using build directory: $BUILD_DIR"

          mkdir -p pages
          cp -R "$BUILD_DIR"/. pages/

          echo "Pages directory:"
          ls -la pages

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./wedding-rsvp/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4